<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Sign in to IDEAZ Messenger">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/ideaz-icon.svg">
  <link rel="apple-touch-icon" href="/assets/ideaz-icon.svg">
  <title>Login · IDEAZ Messenger</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/pwa.css">
</head>
<body>
  <button id="themeButton" class="theme-button" aria-label="Toggle theme">◐</button>
  <main class="auth-shell">
    <section class="auth-intro"><div class="brand"><span class="brand-mark">IZ</span>IDEAZ Messenger</div><div><h1>Apne logon ke qareeb rahain.</h1><p>Fast, private aur simple real-time messaging—family aur close friends ke liye.</p></div><div class="privacy">🔒 Aapki private family space</div></section>
    <section class="auth-card"><h2>Welcome back</h2><p class="sub">Apna username aur password enter karein.</p><form data-auth-form="login"><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required minlength="3" placeholder="ahmed"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="4" placeholder="••••"></div><button class="primary" type="submit">Login</button><p id="formMessage" class="message" role="status"></p></form><p class="switch">Naya account? <a href="/register">Create account</a></p></section>
  </main>
  <script src="/js/config.js"></script><script src="/js/storage.js"></script><script src="/js/api.js?v=12"></script><script src="/js/auth.js"></script><script src="/js/pwa.js?v=2"></script>
</body>
</html>
